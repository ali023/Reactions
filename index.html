<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice-Pause Reaction Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
  #setup{padding:20px;max-width:480px;margin:auto}
  input,button{font-size:16px;padding:12px;border-radius:10px;border:0;width:100%;box-sizing:border-box;margin:6px 0}
  button{background:#e11d48;color:#fff;font-weight:600}
  #stage{display:none;height:100%;flex-direction:column}
  #yt{flex:1;min-height:0;background:#111}
  #yt iframe{width:100%;height:100%}
  #cam{flex:1;min-height:0;position:relative;background:#222}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #badge{position:absolute;top:8px;left:8px;background:#0008;padding:6px 10px;border-radius:20px;font-size:14px}
  #bar{display:flex;gap:6px;padding:6px;background:#111}
  #bar button{margin:0;padding:10px;background:#333}
</style>
</head>
<body>
<div id="setup">
  <h2>Voice-Pause Reaction Studio</h2>
  <p>Paste a YouTube link. Say <b>"pause"</b> / <b>"stop"</b> to pause, <b>"play"</b> / <b>"go"</b> to resume, <b>"back"</b> to rewind 10s.</p>
  <input id="url" placeholder="https://youtube.com/watch?v=...">
  <button id="start">Start</button>
  <p id="msg"></p>
</div>
<div id="stage">
  <div id="yt"><div id="player"></div></div>
  <div id="cam"><video id="v" autoplay playsinline muted></video><div id="badge">🎤 starting…</div></div>
  <div id="bar">
    <button id="bPlay">Play</button><button id="bPause">Pause</button><button id="bBack">-10s</button><button id="bVoice">Voice: off</button>
  </div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, rec, ytReady=false, pendingId=null;
const $=id=>document.getElementById(id);
function parseId(u){
  const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m?m[1]:null;
}
function onYouTubeIframeAPIReady(){ ytReady=true; }
function setBadge(t){ $('badge').textContent=t; }

function handle(text){
  text=text.toLowerCase();
  if(/\b(pause|stop|wait|hold on)\b/.test(text)){ player.pauseVideo(); setBadge('⏸ paused'); }
  else if(/\b(play|go|continue|resume)\b/.test(text)){ player.playVideo(); setBadge('▶ playing'); }
  else if(/\b(back|rewind|replay)\b/.test(text)){ player.seekTo(Math.max(0,player.getCurrentTime()-10),true); setBadge('⏪ -10s'); }
}

function startListening(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ setBadge('Voice not supported — use buttons'); return; }
  rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='en-US';
  let last=0;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(i<last) continue;
      handle(e.results[i][0].transcript);
      if(e.results[i].isFinal) last=i+1;
    }
  };
  rec.onend=()=>{ try{rec.start();}catch(_){} last=0; };
  rec.onerror=e=>setBadge('mic: '+e.error);
  try{ rec.start(); setBadge('🎤 listening'); }catch(_){}
}

$('start').onclick=async()=>{
  const id=parseId($('url').value.trim());
  if(!id){ $('msg').textContent='Could not read that YouTube link.'; return; }
  if(!ytReady){ $('msg').textContent='YouTube is still loading, try again.'; return; }
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    $('v').srcObject=s;
  }catch(e){ $('msg').textContent='Camera blocked: '+e.message+' (page must be on https).'; return; }
  $('setup').style.display='none'; $('stage').style.display='flex';
  player=new YT.Player('player',{height:'100%',width:'100%',videoId:id,
    playerVars:{playsinline:1,rel:0,modestbranding:1},
    events:{onReady:()=>{ if(!/iPhone|iPad|iPod/.test(navigator.userAgent)) setVoice(true); else setBadge('Voice off (iPhone) — tap Voice to enable'); }}});
};
let voiceOn=false;
function setVoice(on){
  voiceOn=on; $('bVoice').textContent='Voice: '+(on?'on':'off');
  if(on) startListening();
  else if(rec){ rec.onend=null; try{rec.stop();}catch(_){} setBadge('voice off'); }
}
$('bVoice').onclick=()=>setVoice(!voiceOn);
$('bPlay').onclick=()=>handle('play');
$('bPause').onclick=()=>handle('pause');
$('bBack').onclick=()=>handle('back');
</script>
</body>
</html>
